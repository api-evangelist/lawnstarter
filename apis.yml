name: LawnStarter
description: >-
  LawnStarter is an on-demand lawn care and outdoor-services marketplace founded in 2013 and headquartered
  in Austin, Texas, that connects homeowners with vetted local lawn care professionals ("LawnTrepreneurs").
  Beyond recurring lawn mowing, the platform books more than 30 services including landscaping, lawn
  treatments and fertilization, tree care, gutter cleaning, pressure washing, and leaf removal, with
  transparent online quoting, consistent crews, and a re-mow-or-refund quality guarantee. LawnStarter
  operates across 500+ cities, has served more than 500,000 customers through roughly 7,500 professionals,
  and reached profitability in 2021. LawnStarter runs a consumer web/mobile marketplace and a separate
  provider app (pros.lawnstarter.com); it does not publish a public developer platform, API, or SDKs.
